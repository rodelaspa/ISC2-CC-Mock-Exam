<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Crisp White Badge Base -->
  <rect width="512" height="512" rx="84" fill="#FFFFFF" />

  <!-- Teal Frame Segment (Top, Left, Bottom-Left, and Upper-Right) -->
  <path
    d="M 248 450 H 134 A 88 88 0 0 1 46 362 V 148 A 88 88 0 0 1 134 60 H 336 A 88 88 0 0 1 424 148 V 262"
    fill="none"
    stroke="#7AB8BF"
    stroke-width="34"
    stroke-linecap="butt"
    stroke-linejoin="round"
  />

  <!-- Lime Green Frame Segment (Lower-Right Corner) -->
  <path
    d="M 424 298 V 362 A 88 88 0 0 1 336 450 H 281"
    fill="none"
    stroke="#8EC63F"
    stroke-width="34"
    stroke-linecap="butt"
    stroke-linejoin="round"
  />

  <!-- Center "CC" and "SM" Mark -->
  <text
    x="220"
    y="286"
    text-anchor="middle"
    fill="#000000"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="114"
    font-weight="800"
    letter-spacing="2"
  >CC</text>
  <text
    x="298"
    y="286"
    text-anchor="start"
    fill="#000000"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="27"
    font-weight="800"
    letter-spacing="0.5"
  >SM</text>

  <!-- ISC2 Black Circle Badge (Top Right) -->
  <circle cx="436" cy="136" r="65" fill="#1D1D1B" />

  <!-- "ISC2" Geometric White Lettering Inside Circle -->
  <text
    x="436"
    y="153"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="48"
    font-weight="600"
    letter-spacing="1.5"
  >ISC2</text>
</svg>
